# HA proof harness — the single shared Postgres control-plane backend.
# Both Squadron ENTERPRISE instances point storage.app.type=postgres at this.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ha-proof-postgres
    environment:
      POSTGRES_USER: squadron
      POSTGRES_PASSWORD: squadron
      POSTGRES_DB: squadron
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadron -d squadron"]
      interval: 2s
      timeout: 3s
      retries: 30
