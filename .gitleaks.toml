# Squadron — gitleaks configuration (CI secret-scanning gate)
#
# Extends gitleaks' default ruleset (useDefault = true) so ANY newly introduced
# real secret fails CI. The allowlist below suppresses ONLY the known, verified
# non-secrets from the 2026-08-24 deep security scan:
#   - trufflehog --only-verified over full git history = 0 verified secrets.
#   - Every entry here is a synthetic test fixture, an AAD label constant, a UI
#     example string, or generated build output — never a live credential.
#
# See docs/security-gates.md (gitleaks section) for the rationale behind each entry.
#
# HOW THE GATE BEHAVES:
#   - A NEW secret in any non-allowlisted path (or a new secret shape in an
#     allowlisted FILE that isn't a fixture) -> RED. That is the point.
#   - Do NOT add real credentials here. Rotate + remove them instead.

title = "Squadron gitleaks config"

[extend]
# Inherit all upstream default rules; we only *add* an allowlist on top.
useDefault = true

[[allowlists]]
description = "Known non-secret test fixtures, label constants, UI examples, and generated build artifacts (2026-08-24 scan triage)."
# Match on file path. Anything under these paths is exempt.
paths = [
  # --- Deliberate synthetic secrets in tests (fixtures, not credentials) ---
  # redact_test.go embeds fake ghp_ / JWT / api-key values on purpose to test
  # the AI secret-redactor; audit_explain_test.go and stress_seeds_test.go use
  # synthetic seeds; github_pat_test.go tests PAT storage with fake ghp_ tokens;
  # factory_test.go carries an RSA test key.
  '''internal/ai/redact_test\.go''',
  '''internal/ai/audit_explain_test\.go''',
  '''internal/proposer/stress_seeds_test\.go''',
  '''internal/discovery/iacconnstore/github_pat_test\.go''',
  '''internal/discovery/scannerfactory/factory_test\.go''',
  # set_apikey_test.go / ai_credential_routes_test.go: synthetic AI provider-key
  # fixtures for the admin-set-key feature (never live credentials).
  '''internal/ai/set_apikey_test\.go''',
  '''internal/api/ai_credential_routes_test\.go''',

  # --- Non-secret source constants / UI example strings ---
  # oci_signing_key.go: the "squadron.oci_signing_key.v1" AAD label constant.
  '''internal/discovery/credstore/oci_signing_key\.go''',
  # DiscoveryOCI.{tsx,test.tsx}: placeholder/sample PEM shown in the UI + test.
  '''ui/src/pages/DiscoveryOCI\.tsx''',
  '''ui/src/pages/DiscoveryOCI\.test\.tsx''',
  # CommandPaletteHint.tsx: a "squa…v1" example string in the command palette.
  '''ui/src/components/CommandPaletteHint\.tsx''',

  # --- Generated / vendored build output (never source; gitignored, but keep
  #     the gate clean if a build ran before scanning locally) ---
  '''(^|/)ui/dist/''',
  '''(^|/)ui/coverage/''',
  '''(^|/)ui/\.pnpm-store/''',
  '''(^|/)node_modules/''',
]

# NOTE: .env is intentionally NOT allowlisted. It is gitignored (never in a CI
# checkout) and if one is ever committed we WANT the gate to fail — that is the
# real-secret tripwire.
